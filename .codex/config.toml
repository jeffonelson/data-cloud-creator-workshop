# Project-scoped MCP servers for the SVL workshop.
# Codex loads this file only after the repository is trusted.

[mcp_servers.google_developer_knowledge]
url = "https://developerknowledge.googleapis.com/mcp"
env_http_headers = { "X-Goog-Api-Key" = "WORKSHOP_DK_API_KEY" }
enabled_tools = ["search_documents", "get_documents", "answer_query"]
default_tools_approval_mode = "auto"
startup_timeout_sec = 30
tool_timeout_sec = 60
enabled = true
required = false

[mcp_servers.maps_grounding_lite]
url = "https://mapstools.googleapis.com/mcp"
env_http_headers = { "X-Goog-Api-Key" = "WORKSHOP_MAPS_API_KEY" }
enabled_tools = ["search_places", "lookup_weather", "compute_routes"]
default_tools_approval_mode = "auto"
startup_timeout_sec = 30
tool_timeout_sec = 60
enabled = true
required = false

# Cloud Run takes no API key: bin/mcp-dak-proxy runs the Data Agent Kit's
# bundled proxy, which authenticates with the attendee's own Application
# Default Credentials. Codex does not expand environment variables inside args,
# so the command is a repository-relative path and the launcher's working
# directory is what resolves it. env_vars forwards the resolved proxy location;
# without it the script falls back to resolving the path itself.
#
# The two read-only tools are approved automatically. The deploy tools are not:
# they create and replace real services, and a prompt before that is worth the
# few seconds it costs.
[mcp_servers.cloud_run]
command = "./bin/mcp-dak-proxy"
args = ["https://run.googleapis.com/mcp"]
env_vars = ["WORKSHOP_DAK_PROXY"]
enabled_tools = [
  "get_service",
  "list_services",
  "deploy_service_from_image",
  "deploy_service_from_archive",
  "deploy_service_from_file_contents",
]
startup_timeout_sec = 30
# Deploys are slower than a metadata read; the default timeout cuts them off.
tool_timeout_sec = 180
enabled = true
required = false
default_tools_approval_mode = "prompt"

[mcp_servers.cloud_run.tools.get_service]
approval_mode = "auto"

[mcp_servers.cloud_run.tools.list_services]
approval_mode = "auto"

# Upstream setup selects BigQuery, AlloyDB and Cloud Storage, plus notebook/viz.
# Codex can restore DAK's full bundled catalog after setup. That larger catalog
# can hide Storage from the model even when the MCP connection is healthy.
# Keep the workshop selection using supported plugin policy, not copied server
# commands or edits to the installed cache. These switches apply only here.
[plugins."dak@dak-marketplace".mcp_servers.dak-bigtable]
enabled = false

[plugins."dak@dak-marketplace".mcp_servers.dak-bigtable-data]
enabled = false

[plugins."dak@dak-marketplace".mcp_servers.dak-cloudsql]
enabled = false

[plugins."dak@dak-marketplace".mcp_servers.dak-kc]
enabled = false

[plugins."dak@dak-marketplace".mcp_servers.dak-spanner]
enabled = false

[plugins."dak@dak-marketplace".mcp_servers.dak-spark]
enabled = false

# Keep the API keys available to Codex's HTTP MCP client, but do not forward
# them into shell commands launched by the agent. The legacy exclusion array
# is intentional: Codex CLI 0.153.0 accepts the canonical `filters` map in a
# project config but does not enforce it for agent-launched shell commands.
[shell_environment_policy]
exclude = ["WORKSHOP_DK_API_KEY", "WORKSHOP_MAPS_API_KEY"]
